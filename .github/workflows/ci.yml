name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Race tests
        shell: bash
        run: |
          packages=(
            ./cmd/...
            ./internal/probe
            ./internal/mockserver
            ./internal/loadgen
            ./internal/metrics
          )
          if [[ -d internal/report ]]; then
            packages+=(./internal/report)
          fi
          go test -race "${packages[@]}"

          # Enable once the owner-owned Config.Validate and ComparePercentile implementations land:
          # go test -race ./...
